name: Coznt - create Nx project
run-name: "Coznt Nx: ${{ inputs.project_name }} (${{ inputs.branch }})"
on:
  workflow_dispatch:
    inputs:
      project_name: { required: true, type: string }
      template: { required: true, type: string }
      branch: { required: true, type: string }
      base_branch: { required: true, type: string }
      coznt_project_id: { required: true, type: string }
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Nx generators can invoke npm internally. Use npm's stable peer resolver
      # to avoid Arborist crashing with "Cannot read properties of null (edgesOut)".
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Select branch
        env:
          BRANCH: "${{ inputs.branch }}"
          BASE_BRANCH: "${{ inputs.base_branch }}"
        run: |
          if [[ "$BRANCH" == "$BASE_BRANCH" ]]; then
            echo "Source and target branches must be different." >&2
            exit 2
          fi
          git fetch origin "$BASE_BRANCH"
          if git fetch origin "$BRANCH"; then
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH" "origin/$BASE_BRANCH"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
      - name: Install workspace dependencies
        shell: bash
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then yarn install --immutable
          elif [[ -f package-lock.json ]]; then npm ci
          else echo 'A supported lockfile is required.' >&2; exit 2
          fi
      - name: Generate application with Nx
        env:
          NAME: "${{ inputs.project_name }}"
          TEMPLATE: "${{ inputs.template }}"
          NX_IGNORE_UNSUPPORTED_TS_SETUP: "true"
        shell: bash
        run: |
          case "$TEMPLATE" in
            angular) PLUGIN='@nx/angular'; GENERATOR='@nx/angular:application' ;;
            next) PLUGIN='@nx/next'; GENERATOR='@nx/next:application' ;;
            node) PLUGIN='@nx/node'; GENERATOR='@nx/node:application' ;;
            *) echo "Unsupported template: $TEMPLATE" >&2; exit 2 ;;
          esac
          node -e "require.resolve('$PLUGIN/package.json')" >/dev/null 2>&1 || npx nx add "$PLUGIN" --no-interactive
          npx nx generate "$GENERATOR" "apps/$NAME" --e2eTestRunner=none --no-interactive
      - name: Synchronize dependency lockfile
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then pnpm install --no-frozen-lockfile
          elif [[ -f yarn.lock ]]; then yarn install
          elif [[ -f package-lock.json ]]; then npm install --package-lock-only --legacy-peer-deps
          else echo 'A supported lockfile is required.' >&2; exit 2
          fi
      - name: Commit and push
        env:
          NAME: "${{ inputs.project_name }}"
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: scaffold $NAME with Nx"
          git push --set-upstream origin "$BRANCH"
      - name: Open pull request
        env:
          GH_TOKEN: "${{ github.token }}"
          NAME: "${{ inputs.project_name }}"
        run: |
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --head "$BRANCH" --base "$BASE_BRANCH" --title "feat: scaffold $NAME with Nx" --body "Generated by Coznt in GitHub Actions."
